[package]
name = "rustcore"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.21", default-features = false }
rustcache = { path = "../rustcache" }
media = { path = "../media" }
dec-jpeg = { path = "../dec-jpeg" }
dec-png = { path = "../dec-png" }
dec-webp = { path = "../dec-webp" }
dec-gif = { path = "../dec-gif" }
dec-webm = { path = "../dec-webm" }
dec-tgs = { path = "../dec-tgs" }
camera_pipeline = { path = "../camera" }
crc32fast = "1.5"
flate2 = "1.1"
ring = "0.17.14"
aes = { version = "0.8", features = ["zeroize"] }
async-trait = "0.1"
ctr = "0.9"
opus-pure = "=0.2.3"
rtc = { version = "=0.21.1", default-features = false }
rtc-sctp = "=0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
webrtc = "=0.21.1"
zeroize = "1"

[dev-dependencies]
webrtc = { version = "=0.21.1", features = ["runtime-mock"] }
